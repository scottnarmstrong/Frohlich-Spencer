review:
  status: "author-verified"
  reviewers:
    - "Scott Armstrong"
    - "Amélie Loher"
  notes: >-
    Lean checks each proof against its formal statement. The authors reviewed
    that the statements are the intended theorems. Each source-facing
    statement was compared with the sources by independent model reviews
    before it was fixed, and the comparator declarations are checked
    mechanically. This is not external peer review.

fidelity:
  divergences: >-
    All errata and deviations are listed in docs/ERRATA-AND-DEVIATIONS.md.
    FS81: 18 errata and 18 deviations. Kharash-Peled: 48 errata and 10
    deviations. FS82: 21 errata and 13 deviations. FS83: 22 errata and 11
    deviations. Counts refer to entries, including editorial misprints;
    repeated occurrences may be grouped. The list separates printed errors
    from scope restrictions, additional hypotheses, normalization and
    orientation conventions, limit-point readings and proof supplements.

alignment:
  - source: "Fröhlich–Spencer (1983)"
    lean: "FroehlichSpencer.existsUnique_squareSummable_greenSolution"
    note: "FS83 (1.4): unique square-summable solution of the lattice Green equation for every real potential and every non-real spectral parameter, in every dimension."
  - source: "Fröhlich–Spencer (1983)"
    lean: "FroehlichSpencer.existsUnique_integratedDensityOfStates"
    note: "FS83 (1.10): for a single-site law with bounded density, a unique integrated density of states, the almost-sure limit along centered cubes for all energies at once."
  - source: "Fröhlich–Spencer (1983)"
    lean: "FroehlichSpencer.finiteVolumeGreen_probability_bound"
    note: "FS83 Theorem 1.2 in a finite box with Dirichlet boundary conditions: with probability at least 1 - K/N^p, |G(E+i eps;0,x)| <= exp(m(N-|x|)) for all real eps != 0, uniformly in the box, at large disorder or at high energy for Gaussian disorder."
  - source: "Fröhlich–Spencer (1983)"
    lean: "FroehlichSpencer.green_probability_bound"
    note: "FS83 Theorem 1.2 in infinite volume, in the same two regimes; constants depend on the dimension, m and p (and the variance in the Gaussian regime)."
  - source: "Fröhlich–Spencer (1983)"
    lean: "FroehlichSpencer.theorem_1_1"
    note: "FS83 Theorem 1.1: the Kubo diffusion coefficient vanishes at every energy where the integrated density of states has a positive derivative, in the two regimes."
  - source: "Fröhlich–Spencer (1983)"
    lean: "FroehlichSpencer.green_almostSure_decay"
    note: "For every m > 0, almost surely |G(E+i eps;0,x)| <= exp(-m|x|/2) for all |x| beyond a random radius and all eps != 0, in the two regimes."
  - source: "Kharash–Peled (2017)"
    lean: "FroehlichSpencer.BKT.integerGFF_delocalization"
    note: "KP Theorem 1.1: exponential-moment and second-moment lower bounds and logarithmic variance growth for the integer-valued GFF at small beta, on free squares and even periodic squares, uniformly in the side."
  - source: "Kharash–Peled (2017)"
    lean: "FroehlichSpencer.BKT.villain_powerLaw_lower_bound"
    note: "KP Theorem 1.3: E cos(theta_j) >= (1 + dist(j, boundary))^(-C/beta) in the wired Villain model on finite squares, for large beta."
  - source: "Kharash–Peled (2017)"
    lean: "FroehlichSpencer.BKT.weightedGFF_expMoment_lower_bound"
    note: "KP Theorem 1.5: exponential-moment lower bound for Gaussian free fields with sub-Gaussian trigonometric site weights at small beta, on free and even periodic squares."
  - source: "Kharash–Peled (2017)"
    lean: "FroehlichSpencer.BKT.weightedGFF_renormalization"
    note: "KP Theorem 1.6: exact finite convex decomposition into neutral charge ensembles with activity and separation bounds."
  - source: "Fröhlich–Spencer (1981)"
    lean: "FroehlichSpencer.BKT.planeRotator_powerLaw_lower_bound"
    note: "FS81 Theorem C: for large beta the infinite-volume two-point function of the plane rotator is at least A(1+|j-l|)^(-1/(2 pi beta')), with beta'(beta) > 1/(4 pi) and beta' -> infinity."
  - source: "Fröhlich–Spencer (1981)"
    lean: "FroehlichSpencer.BKT.planeRotator_kosterlitzThouless_transition"
    note: "Existence of beta_c > 0: exponential decay of the two-point function below it; above it no exponential bound and uniform decay to zero (no long-range order). The value of beta_c is not determined."
  - source: "Fröhlich–Spencer (1981)"
    lean: "FroehlichSpencer.BKT.conditionLambdaGas_secondMomentLimit_lower_bound"
    note: "FS81 Theorem A: for Condition-lambda activities with vacancy lambda(0) >= nu > 0 and large beta, the gas is summable, a free-boundary limit exists, and every limit of the potential second moments is at least (1-delta) beta (g, -Laplacian^{-1} g)."
  - source: "Fröhlich–Spencer (1981)"
    lean: "FroehlichSpencer.BKT.conditionLambdaGas_fracCorrelationLimit_upper_bound"
    note: "FS81 Theorem B: under the same hypotheses every limit of the fractional-charge correlation is between 0 and const |x|^(-beta'), with beta' -> infinity as beta -> infinity."
  - source: "Fröhlich–Spencer (1981)"
    lean: "FroehlichSpencer.BKT.clock_phase_diagram"
    note: "Z_n clock models: exponential decay of the fundamental harmonic for beta < beta_h (n >= 2); long-range order of every harmonic for beta > betabar(n) (n >= 2); and, for every margin q and all sufficiently large n, a massless phase on [beta_0, beta_1(n)] with beta_1(n) -> infinity."
  - source: "Fröhlich–Spencer (1981)"
    lean: "FroehlichSpencer.BKT.clock_disorder_lowerBound"
    note: "FS81 (7.5) for the Z_n twists xi = k/n, n >= n_1(beta): every limit of the disorder expectation at (r,0) is at least C(1+r)^(-xi^2 beta'''/(2 pi)). A proved negative theorem covers real xi off the grid."
  - source: "Fröhlich–Spencer (1981)"
    lean: "FroehlichSpencer.BKT.freeVillain_disorderLimit_upper_bound"
    note: "FS81 Theorem D: for xi in (0,1) and large beta, a limit of the Villain disorder expectation along boxes exists and every such limit is at most const (1+n)^(-xi^2 beta'') at x = (n,0)."
  - source: "Fröhlich–Spencer (1981)"
    lean: "FroehlichSpencer.BKT.sos_theorem73_dirichlet"
    note: "FS81 Theorem 7.3 in Dirichlet boxes at small beta: exponential-moment and variance lower bounds of order (1/beta') log(1+r) for height differences."
  - source: "Fröhlich–Spencer (1981)"
    lean: "FroehlichSpencer.BKT.sos_roughening_transition"
    note: "Roughening of the solid-on-solid model in Dirichlet boxes: height fluctuations unbounded for beta <= beta_0 and uniformly bounded for beta >= beta_1."
  - source: "Fröhlich–Spencer (1981)"
    lean: "FroehlichSpencer.BKT.Surface.VillainClock.villain_clock_theorem71_1"
    note: "Villain-clock Theorem 7.1(1): the Villain correlation is at most the Villain-clock correlation, on finite domains and for the upper limit along free boxes."
  - source: "Fröhlich–Spencer (1981)"
    lean: "FroehlichSpencer.BKT.Surface.VillainClock.villain_clock_theorem71_2"
    note: "Villain-clock Theorem 7.1(2): power-law upper bound for high harmonics on boxes and for the upper limit along free boxes."
  - source: "Fröhlich–Spencer (1981)"
    lean: "FroehlichSpencer.BKT.villainClock_disorder_lowerBound_grid_exhausting"
    note: "Villain-clock disorder lower bound on the Z_N grid for every limit point of an exhaustion by boxes."
  - source: "Fröhlich–Spencer (1982)"
    lean: "FroehlichSpencer.FS82.Surface.fs82FiniteVillainDualMomentComparisonLogThick"
    note: "FS82 (2.93) in finite volume, dimension four: for beta >= beta_0, every log-thick box, every interior-supported co-closed real 1-form mu and every real eps, exp(eps^2 beta'' Q(mu)/2) <= <exp(eps alpha(mu))> <= exp(eps^2 beta Q(mu)/2), with 0 < beta'' < beta, beta''/beta -> 1."
  - source: "Fröhlich–Spencer (1982)"
    lean: "FroehlichSpencer.FS82.SurfaceInfinite.source_infiniteVolume_momentComparison"
    note: "FS82 (2.90)–(2.93) for every limit state of the dual curvature along centered cubes, with the Fourier Green quadratic; no uniqueness or existence of the limit."
  - source: "Fröhlich–Spencer (1982)"
    lean: "FroehlichSpencer.FS82.SurfaceInfinite.source_curvatureCorrelation_nonsummable"
    note: "FS82 §2.11 (display after (2.91)): for large beta, a translation-invariant limit state whose dual curvature two-point function in one lattice plane is not absolutely summable."
  - source: "Fröhlich–Spencer (1982)"
    lean: "FroehlichSpencer.FS82.SurfaceInfinite.source_primalFieldStrength_nonsummable"
    note: "FS82 (2.89) and §2.11: in the same selected state, for every nonzero displacement, the box-averaged finite-volume correlations of the Villain field strength converge along one subsequence of cubes to the dual curvature correlation, which is not absolutely summable. Off the diagonal; no primal Gibbs state."
  - source: "Fröhlich–Spencer (1982)"
    lean: "FroehlichSpencer.FS82.Surface.fs82WilsonLoopPerimeterLawCube"
    note: "FS82 (1.13), (2.8) in finite volume: for large beta the Villain Wilson loop expectation on centered cubes is real and at least exp(-d(beta)(L+T)), uniformly in the cube."
  - source: "Fröhlich–Spencer (1982)"
