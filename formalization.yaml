    note: "Both Wilson-loop laws on one family of centered cubes, with 0 < beta_0 < beta_1; nothing is asserted between the thresholds."
  - source: "Fröhlich–Spencer (1982)"
    lean: "FroehlichSpencer.FS82.SurfaceZN.fs82_zn_disorder_perimeter_root"
    note: "FS82 (3.54) on centered cubes: for every beta > 0 and N >= N_0(beta), the disorder expectation of the interpolating laws (every finite h) and of the Z_N theory is at least exp(-C beta (xi/N)^2 (L+T)), for integers 1 <= xi < N."
  - source: "Fröhlich–Spencer (1982)"
