version: "v0.4"

project:
  name: "Classical theorems of Fröhlich and Spencer: the Kosterlitz–Thouless transition, massless phases of abelian gauge theories, and Anderson localization"
  description: >-
    A Lean 4 / Mathlib formalization of three papers of J. Fröhlich and T.
    Spencer (Communications in Mathematical Physics, 1981, 1982 and 1983),
    with the two-dimensional multiscale analysis in the finite-volume form of
    V. Kharash and R. Peled (2017). For the two-dimensional plane rotator it
    proves the Kosterlitz–Thouless transition: the two-point function decays
    exponentially at high temperature, while at low temperature it obeys the
    power-law lower bound of Theorem C and still tends to zero, so that there
    is no long-range order. The same multiscale expansion in charge ensembles
    gives the absence of screening and the power-law decay of fractional
    charges in two-dimensional Coulomb gases (Theorems A and B), the phase
    diagram of the Z_n clock models with an intermediate massless phase
    (Theorem 7.1), disorder bounds for the Villain model (Theorem D) and the
    roughening transition of the solid-on-solid model (Theorem 7.3), as well
    as the four finite-square theorems of Kharash and Peled. For the
    four-dimensional Villain U(1) lattice gauge theory at large beta it
    proves that the integer-valued dual gauge field has the exponential
    moments of a free massless field up to a renormalization of the coupling
    from beta to beta''(beta) with beta''/beta -> 1, in finite volume (2.93)
    and for every limit state along cubes; that a translation-invariant limit
    state has a field-strength correlation that is not summable, obtained as
    the limit of the finite-volume field-strength correlations, which is the
    paper's massless photon; the perimeter law of the Wilson loop at large
    beta and its area law at small beta; a perimeter law for the disorder
    operator of the Z_N gauge theories; and long-range order of the Villain
    XY model in every dimension D >= 3. For the Anderson tight-binding model
    on Z^nu at large disorder, or at high energy with Gaussian disorder, it
    proves exponential decay of the Green function with polynomially high
    probability, uniformly in the imaginary part of the energy (Theorem 1.2),
    its almost-sure decay, and the vanishing of the Kubo diffusion
    coefficient wherever the density of states is positive (Theorem 1.1). The
    FS82 statements are in finite volume or about limit points along cubes;
    the thermodynamic limits that the paper takes from Ginibre's inequalities
    are not formalized. Corrections to the printed texts are listed in the
    README.
  authors:
    - "Scott Armstrong"
    - "Amélie Loher"
  responsible_maintainers:
    - "Scott Armstrong"
    - "Amélie Loher"
  affiliations:
    - "Scott Armstrong: CNRS and Laboratoire Jacques-Louis Lions, Sorbonne Université; Courant Institute School of Mathematics, Computing, and Data Science, New York University"
    - "Amélie Loher: All Souls College, University of Oxford"
  license: "Apache-2.0"
  funding:
    - "Scott Armstrong was supported by the European Research Council (ERC) under the European Union's Horizon Europe research and innovation programme, grant agreement No. 101200828."
    - "Amélie Loher acknowledges support from the Fondation Sciences Mathématiques de Paris."

classification:
  arxiv: ["math-ph", "math.PR", "math.SP"]
  msc2020: ["47B80", "81T25", "82B20", "82B26"]

sources:
  - title: "The Kosterlitz–Thouless transition in two-dimensional Abelian spin systems and the Coulomb gas"
    authors: ["J. Fröhlich", "T. Spencer"]
    type: "paper"
    id: "doi:10.1007/BF01208273"
    url: "https://doi.org/10.1007/BF01208273"
    location: "Communications in Mathematical Physics 81 (1981), 527–602; Theorems A, B, C, D, (1.30), (1.31), (6.1), §7.1 (clock models, Theorem 7.1, (7.5)), §7.2 (Theorem 7.3)"
    relationship: "formalizes"
    note: >-
      Thermodynamic limits are with free boundary
      conditions; where a limit is not known to be unique the statement is about
      every limit along an exhaustion by boxes. Recorded departures from the
      printed text: a vacancy lambda(0) >= nu > 0 in Theorems A and B; (7.5)
      restricted to the Z_N twists xi = k/N, with a proved negative theorem off
      the grid; a repaired interpolation condition and a limit-point reading of
      the state (7.16) in Theorem 7.3.
  - title: "Massless phases and symmetry restoration in Abelian gauge theories and spin systems"
    authors: ["J. Fröhlich", "T. Spencer"]
    type: "paper"
    id: "doi:10.1007/BF01213610"
    url: "https://doi.org/10.1007/BF01213610"
    location: "Communications in Mathematical Physics 83 (1982), 411–454; (1.13), (2.7), (2.8), (2.89), (2.90)–(2.93), §2.11, (3.54), (4.40)"
    relationship: "formalizes"
    note: >-
      The first root is the finite-volume dual moment
      comparison (2.93) on log-thick boxes in dimension four. The other results
      are for the Villain action (Wilson's action in §3), in finite volume on
      centered cubes or for limit points along cubes. The existence of the
      thermodynamic limits (Ginibre's inequalities) is outside the scope, and so
      are the paper's extensions to Wilson's action in §2 and §4. Recorded
      departures from the printed text are listed in the README.
  - title: "Absence of diffusion in the Anderson tight binding model for large disorder or low energy"
    authors: ["J. Fröhlich", "T. Spencer"]
    type: "paper"
    id: "doi:10.1007/BF01209475"
    url: "https://doi.org/10.1007/BF01209475"
    location: "Communications in Mathematical Physics 88 (1983), 151–184; equations (1.4), (1.10)–(1.15), Theorems 1.1 and 1.2"
    relationship: "formalizes"
    note: >-
      existence and uniqueness of the Green function for
      every real potential, the integrated density of states, Theorem 1.2 in
      finite and infinite volume, Theorem 1.1, and almost-sure decay. Two
      regimes: a single-site density bounded by a small constant (large
      disorder, every energy), and Gaussian disorder at high energy. Recorded
      departures: the mass recurrence (3.2) with exponent 1/8 and a shifted
      index, the exponent of (2.24), and the factor 2 in (1.25).
  - title: "The Fröhlich–Spencer Proof of the Berezinskii–Kosterlitz–Thouless Transition"
    authors: ["Vital Kharash", "Ron Peled"]
    type: "paper"
    id: "arxiv:1711.04720v1"
    url: "https://arxiv.org/abs/1711.04720v1"
    location: "Version 1, Theorems 1.1, 1.3, 1.5, and 1.6"
    relationship: "adapts"
    note: >-
      The pinned version controls the four finite-square statements and the
      proof route of the multiscale analysis. It is not the source of the FS81
      statements.

automation:
  methods:
    - method: "agent"
      models:
        - "gpt-6-luna"
        - "gpt-6.1-sol"
        - "claude-opus-5-5"
        - "claude-sonnet-5-5"
      framework: >-
        Codex (GPT-6 Luna, GPT-6.1 Sol) and Claude Code (Claude Opus 5.5
        coordinating, Claude Sonnet 5.5), under the authors' supervision.
      tool_setup: >-
        Lean 4 and Mathlib v4.35.0-rc2. Each source-facing definition and
        theorem statement is a separate short module written in terms of
        Mathlib and other such modules; every statement was compared with the
        sources by independent model reviews and approved by the authors, and
        each theorem is proved by one line naming a theorem of the library.
        Verification uses full builds, axiom checks, and Mathlib-only
        comparator challenges checked with Lean's comparator and the
        independent kernel checkers bundled with the toolchain.
      cost:
        wall_time: "about five days of development (6–10 October 2026) plus release preparation"
        spend_usd: "not separately tracked (ChatGPT Pro and Claude Max subscriptions)"
        hardware: "one shared 16-CPU Linux machine"
      prompting_notes: >-
        The authors determined the scope, the proof routes and the
        statements, ruled on every deviation from the printed statements, and
        approved every source-facing statement. Errors and gaps in the
        printed proofs were identified and repaired by arguments proposed by
        the models and checked by separate model reviews before they were
        formalized.
  spend_usd: "not separately tracked (ChatGPT Pro and Claude Max subscriptions)"
  notes: >-
    All Lean code was written by the listed models under the supervision of
    the authors. Every proof is checked by the Lean kernel; the library
    contains no sorry and no custom axiom. The comparator Challenge files
    contain one intentional theorem-body placeholder per theorem, proved by
    the corresponding Solution files. The library has 425 source-facing
    anchors: 28 for FS83, 122 for FS81 and Kharash–Peled, and 275 for FS82.

status:
  scope: >-
    425 source-facing anchors. FS83: the Green function, the integrated density of
    states, Theorems 1.2 and 1.1, almost-sure decay. Kharash–Peled: Theorems
    1.1, 1.3, 1.5, 1.6 on finite squares. FS81: Theorem C and the
    Kosterlitz–Thouless transition of the plane rotator, Theorems A and B for
    Coulomb gases, the clock phase diagram and Theorem 7.1, the disorder bounds
    (7.5), Theorem D, Theorem 7.3 and roughening. FS82: the finite-volume dual
    moment comparison (2.93) on log-thick boxes in dimension four, and (2.93)
    for every limit state along centered cubes; the nonsummability of the
    field-strength correlation in a translation-invariant limit state, for the
    dual curvature and for the limit of the finite-volume field strengths
    (2.89); the Wilson-loop perimeter law (large beta), area law (small beta)
    and their statement on one family of cubes; the Z_N disorder perimeter law
    (3.54) on centered cubes; long-range order (4.40) in the Villain XY model
    on cubes for every D >= 3. Not formalized: the existence or uniqueness of thermodynamic
    limits in FS82, Wilson's action in FS82 §2 and §4, and results the papers
    only cite. This metadata describes the development; it does not claim that
    the full papers are formalized.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - declaration: "FroehlichSpencer.existsUnique_squareSummable_greenSolution"
